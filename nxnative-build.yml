
name: NxNative - Generic IPA Builder
 
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
          - "Switch 2 - Donkey Kong Bananza (experimental)"
      switch2_output:
        description: "Switch 2 only: what to build. Upstream lists Mac only; one community report has it playing on an iPad Pro M4 with 8 GB."
        required: false
        type: choice
        default: "IPA for iPhone/iPad (community-tested on 8 GB iPad)"
        options:
          - "IPA for iPhone/iPad (community-tested on 8 GB iPad)"
          - "Mac app (upstream-tested)"
      memory_profile:
        description: "Switch 2 IPA only: settings baked into the app for 8 GB devices. Use 'Aggressive' if iOS kills the app."
        required: false
        type: choice
        default: "Balanced for 8 GB (handheld resolution, 30 fps)"
        options:
          - "Balanced for 8 GB (handheld resolution, 30 fps)"
          - "Aggressive for 8 GB (adds: Metal 4 pipelines off)"
          - "None (upstream defaults)"
      use_xlarge_runner:
        description: "Switch 2 only: use the xcode-27-xlarge runner (needs a paid GitHub plan; the standard one is slow and small)"
        required: false
        type: boolean
        default: false
      profile_id:
        description: "Base game title ID (manual override; clear for automatic detection)"
        required: false
        type: string
 
permissions:
  contents: read
 
jobs:
  build:
    # Switch 1 paths keep macos-latest. Switch 2 needs the Xcode 27 image
    # (upstream pins Xcode 27.2 at the commit used below).
    runs-on: ${{ startsWith(inputs.device, 'Switch 2') && (inputs.use_xlarge_runner && 'xcode-27-xlarge' || 'xcode-27') || 'macos-latest' }}
    timeout-minutes: 360
    env:
      IS_S2: ${{ startsWith(inputs.device, 'Switch 2') }}
      S2_OUTPUT: ${{ inputs.switch2_output }}
      MEMORY_PROFILE: ${{ inputs.memory_profile }}
 
    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3
 
      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          # Keep the source compatible with the iOS SDK shipped on macos-latest.
          # Later commits use the iOS 27-only CMMotionManager.deviceMotionBody API.
          ref: 971d336516a20dde998f0ede29db7e380a8ee6dd

      - name: Checkout Switch 2 nxnative version
        if: startsWith(inputs.device, 'Switch 2')
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          # Upstream main on 2026-11-01: first Switch 2 title (Donkey Kong
          # Bananza) with folder input, no prod.keys, Ampere shaders, NVN2.
          # Pinned so a later upstream change cannot silently break the build.
          ref: cd859c38a8f8890ddbb57a23d6f45e23ba9e6651

      - name: Select Xcode 27.2 (Switch 2)
        if: startsWith(inputs.device, 'Switch 2')
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Switch 2 support is experimental. Upstream lists Donkey Kong Bananza as Mac only; a community report (nxnative issue 924) has it playing at about 30 fps on an iPad Pro M4 with 8 GB, installed with Increased Memory Limit on."

          WANTED="$(ls -d /Applications/Xcode_27.2*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "$WANTED" ]]; then
            echo "Selecting $WANTED"
            sudo xcode-select -s "$WANTED/Contents/Developer"
          fi

          xcodebuild -version
          VERSION="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          LOWEST="$(printf '%s\n' "27.2" "$VERSION" | sort -V | head -n 1)"
          if [[ "$LOWEST" != "27.2" ]]; then
            echo "::error::Xcode $VERSION is older than 27.2, which the pinned nxnative commit requires. This runner image does not provide it."
            exit 1
          fi
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
 
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
 
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install glslang xcodegen zstd spirv-cross unar
          python -m pip install --upgrade pip
          if [[ "$IS_S2" == "true" ]]; then
            # Package list from the upstream README at the pinned commit.
            python -m pip install \
              lz4 "capstone>=5,<6" fonttools nsz zbic \
              "backports.zstd; python_version < '3.14'" gdown
          else
            python -m pip install \
              lz4 capstone fonttools backports.zstd gdown
          fi

      - name: Install Metal toolchain (Switch 2)
        if: startsWith(inputs.device, 'Switch 2')
        shell: bash
        run: |
          set -euo pipefail
          # Required by the upstream README; a no-op if already installed.
          xcodebuild -downloadComponent MetalToolchain \
            || echo "::warning::Could not download the Metal toolchain; continuing in case it is already present."

      - name: Free disk space (Switch 2)
        if: startsWith(inputs.device, 'Switch 2')
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h "$RUNNER_TEMP" /
          # The build only needs the device SDK, not simulators or Android tools.
          xcrun simctl delete all 2>/dev/null || true
          rm -rf "$HOME/Library/Developer/CoreSimulator/Caches" \
            "$HOME/Library/Android" \
            "$HOME/Library/Developer/Xcode/DerivedData" 2>/dev/null || true
          echo "Disk after cleanup:"
          df -h "$RUNNER_TEMP" /

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          UPDATE_URL2: ${{ secrets.Update_URL2 }}
          UPDATE_URL3: ${{ secrets.Update_URL3 }}
          UPDATE_URL4: ${{ secrets.Update_URL4 }}
          UPDATE_URL5: ${{ secrets.Update_URL5 }}
          UPDATE_URL6: ${{ secrets.Update_URL6 }}
          UPDATE_URL7: ${{ secrets.Update_URL7 }}
          UPDATE_URL8: ${{ secrets.Update_URL8 }}
          UPDATE_URL9: ${{ secrets.Update_URL9 }}
          UPDATE_URL10: ${{ secrets.Update_URL10 }}
          DLC_URL: ${{ secrets.DLC_URL }}
          DLC_URL2: ${{ secrets.DLC_URL2 }}
          DLC_URL3: ${{ secrets.DLC_URL3 }}
          DLC_URL4: ${{ secrets.DLC_URL4 }}
          DLC_URL5: ${{ secrets.DLC_URL5 }}
          DLC_URL6: ${{ secrets.DLC_URL6 }}
          DLC_URL7: ${{ secrets.DLC_URL7 }}
          DLC_URL8: ${{ secrets.DLC_URL8 }}
          DLC_URL9: ${{ secrets.DLC_URL9 }}
          DLC_URL10: ${{ secrets.DLC_URL10 }}
          MOD_URL: ${{ secrets.Mod_URL }}
          MOD_URL2: ${{ secrets.Mod_URL2 }}
          MOD_URL3: ${{ secrets.Mod_URL3 }}
          MOD_URL4: ${{ secrets.Mod_URL4 }}
          MOD_URL5: ${{ secrets.Mod_URL5 }}
          MOD_URL6: ${{ secrets.Mod_URL6 }}
          MOD_URL7: ${{ secrets.Mod_URL7 }}
          MOD_URL8: ${{ secrets.Mod_URL8 }}
          MOD_URL9: ${{ secrets.Mod_URL9 }}
          MOD_URL10: ${{ secrets.Mod_URL10 }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"
 
          download_file() {
            local url="$1"
            local output="$2"

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            echo "Downloading $(basename "$output")..."
            for attempt in 1 2 3; do
              if gdown --continue "$url" -O "$output" \
                && [[ -s "$output" ]]; then
                file "$output"
                return
              fi

              echo "Download attempt $attempt failed; retrying..."
              sleep $((attempt * 10))
            done

            echo "::error::Failed to download $(basename "$output") after 3 attempts."
            exit 1
          }
 
          download_file "$GAME_URL" "$WORK/game.download"

          if [[ "$IS_S2" == "true" ]]; then
            # Switch 2 game files are not encrypted: no prod.keys is needed.
            echo "Switch 2 mode: skipping the keys download."
          else
            download_file "$KEYS_URL" "$WORK/prod.keys"
          fi
 
          for index in {1..10}; do
            if [[ "$index" == "1" ]]; then
              url="${UPDATE_URL:-}"
              label="update"
            else
              url_var="UPDATE_URL${index}"
              url="${!url_var:-}"
              label="update-${index}"
            fi

            if [[ -n "$url" ]]; then
              download_file "$url" "$WORK/${label}.download"
            fi
          done

          for index in {1..10}; do
            if [[ "$index" == "1" ]]; then
              url="${DLC_URL:-}"
              label="dlc"
            else
              url_var="DLC_URL${index}"
              url="${!url_var:-}"
              label="dlc-${index}"
            fi

            if [[ -n "$url" ]]; then
              download_file "$url" "$WORK/${label}.download"
            fi
          done

          if [[ "$IS_S2" == "true" ]]; then
            # The mod overlay patches the Switch 1 NSP packer, which a
            # Switch 2 folder build does not use.
            echo "Switch 2 mode: mod archives are not supported; skipping Mod_URL secrets."
          else
            for index in {1..10}; do
              if [[ "$index" == "1" ]]; then
                url="${MOD_URL:-}"
                label="mod"
              else
                url_var="MOD_URL${index}"
                url="${!url_var:-}"
                label="mod-${index}"
              fi

              if [[ -n "$url" ]]; then
                download_file "$url" "$WORK/${label}.download"
              fi
            done
          fi

          if [[ -z "${UPDATE_URL:-}" && -z "${UPDATE_URL2:-}" && -z "${UPDATE_URL3:-}" &&
            -z "${UPDATE_URL4:-}" && -z "${UPDATE_URL5:-}" && -z "${UPDATE_URL6:-}" &&
            -z "${UPDATE_URL7:-}" && -z "${UPDATE_URL8:-}" && -z "${UPDATE_URL9:-}" &&
            -z "${UPDATE_URL10:-}" ]]; then
            echo "No update URL configured; continuing without an update."
          fi

          if [[ -z "${DLC_URL:-}" && -z "${DLC_URL2:-}" && -z "${DLC_URL3:-}" &&
            -z "${DLC_URL4:-}" && -z "${DLC_URL5:-}" && -z "${DLC_URL6:-}" &&
            -z "${DLC_URL7:-}" && -z "${DLC_URL8:-}" && -z "${DLC_URL9:-}" &&
            -z "${DLC_URL10:-}" ]]; then
            echo "No DLC URL configured; continuing without DLC."
          fi

          if [[ -z "${MOD_URL:-}" && -z "${MOD_URL2:-}" && -z "${MOD_URL3:-}" &&
            -z "${MOD_URL4:-}" && -z "${MOD_URL5:-}" && -z "${MOD_URL6:-}" &&
            -z "${MOD_URL7:-}" && -z "${MOD_URL8:-}" && -z "${MOD_URL9:-}" &&
            -z "${MOD_URL10:-}" ]]; then
            echo "No mod URL configured; continuing without mods."
          fi
 
          if [[ "$IS_S2" != "true" ]]; then
            chmod 600 "$WORK/prod.keys"
          fi

      - name: Extract RAR archives or accept direct game packages
        if: ${{ !startsWith(inputs.device, 'Switch 2') }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"
 
          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path
 
          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }
          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )
 
          def read_magic(path, offset=0):
              with path.open("rb") as f:
                  f.seek(offset)
                  return f.read(4)

          def validate_package(path):
              suffix = path.suffix.lower()
              magic = read_magic(path)

              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".xci", ".xcz") and read_magic(path, 0x100) != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )
 
          def add_package(source, label):
              target = game_dir / source.name
 
              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )
 
              validate_package(source)
              shutil.copy2(source, target)
 
              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )
 
          def process_download(label):
              source = work / f"{label}.download"
 
              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return
 
              signature = read_magic(source)

              is_rar = any(
                  signature == magic[:4]
                  for magic in rar_signatures
              )
 
              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)
 
                  print(f"{label}: RAR archive detected; extracting.")
 
                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )
 
                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )
 
                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )
 
                  for package in packages:
                      add_package(package, label)
 
              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )
 
                  if signature == b"PFS0":
                      extension = ".nsp"
                  elif read_magic(source, 0x100) == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package. "
                          "Direct downloads must be NSP or XCI files."
                      )
 
                  target = game_dir / f"{label}{extension}"
 
                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )
 
                  shutil.copy2(source, target)
                  validate_package(target)
 
                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )
 
          process_download("game")
          process_download("update")
          for index in range(2, 11):
              process_download(f"update-{index}")

          process_download("dlc")
          for index in range(2, 11):
              process_download(f"dlc-{index}")
 
          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )
 
          if not packages:
              raise SystemExit("No game packages were prepared.")
 
          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY
 
          test -s "$WORK/prod.keys"

      - name: Extract Switch 2 game folder
        if: startsWith(inputs.device, 'Switch 2')
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])

          # Layout expected by upstream's scripts/pack_dump.py:
          #   base/exefs/main.npdm, base/romfs/
          #   updates/<version as decimal>/exefs, romfs   (optional)
          #   dlc/<DLC title ID>/<n>/romfs                (optional)
          ROOT_NAMES = ("base", "updates", "dlc")

          def merge_move(src, dst):
              """Move src to dst, merging directories. Same filesystem, so no extra disk."""
              if not dst.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  try:
                      os.rename(src, dst)
                  except OSError:
                      shutil.move(str(src), str(dst))
                  return
              if src.is_dir() and dst.is_dir():
                  for child in sorted(src.iterdir()):
                      merge_move(child, dst / child.name)
                  return
              raise SystemExit(f"Conflicting path while merging archives: {dst}")

          def find_root(extracted):
              """Shallowest directory that holds base/, updates/ or dlc/."""
              level = [extracted]
              while level:
                  for directory in level:
                      if any((directory / name).is_dir() for name in ROOT_NAMES):
                          return directory
                  level = sorted(
                      child
                      for directory in level
                      for child in directory.iterdir()
                      if child.is_dir()
                  )
              return None

          def process_download(label):
              source = work / f"{label}.download"
              if not source.exists():
                  return

              extract_dir = work / f"extracted-{label}"
              extract_dir.mkdir(parents=True, exist_ok=True)
              print(f"{label}: extracting archive.")

              # -D: never wrap the content in an extra folder named after the archive.
              result = subprocess.run(
                  ["unar", "-D", "-f", "-o", str(extract_dir), str(source)]
              )
              if result.returncode != 0:
                  raise SystemExit(
                      f"{label}: could not extract. A Switch 2 download must be an "
                      "archive (zip, rar, 7z) holding the base/, updates/ and dlc/ "
                      "folders, not an NSP or XCI file."
                  )

              root = find_root(extract_dir)
              if root is None:
                  raise SystemExit(
                      f"{label}: no base/, updates/ or dlc/ folder found in the archive."
                  )

              for name in ROOT_NAMES:
                  if (root / name).is_dir():
                      print(f"{label}: adding {name}/")
                      merge_move(root / name, game_dir / name)

              # Free the disk space right away: these trees are huge.
              shutil.rmtree(extract_dir, ignore_errors=True)
              source.unlink()

          process_download("game")
          process_download("update")
          for index in range(2, 11):
              process_download(f"update-{index}")
          process_download("dlc")
          for index in range(2, 11):
              process_download(f"dlc-{index}")

          npdm = game_dir / "base" / "exefs" / "main.npdm"
          romfs = game_dir / "base" / "romfs"
          if not npdm.is_file():
              raise SystemExit("Missing base/exefs/main.npdm in the prepared folder.")
          if not romfs.is_dir() or not any(romfs.iterdir()):
              raise SystemExit("Missing or empty base/romfs in the prepared folder.")

          updates = game_dir / "updates"
          if updates.is_dir():
              for child in sorted(updates.iterdir()):
                  if child.is_dir() and not child.name.isdigit():
                      print(
                          f"::warning::updates/{child.name} is not a decimal version "
                          "number (for example 458752); upstream may ignore it."
                      )

          print("\n=== Prepared Switch 2 folder ===")
          for child in sorted(game_dir.iterdir()):
              print(child.name)
          PY

          echo "Folder size:"
          du -sh "$GAME_DIR"

      - name: Prepare optional mods
        if: ${{ !startsWith(inputs.device, 'Switch 2') }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          MODS_DIR="$WORK/mods"
          mkdir -p "$MODS_DIR"

          for index in {1..10}; do
            if [[ "$index" == "1" ]]; then
              archive="$WORK/mod.download"
              label="mod"
            else
              archive="$WORK/mod-${index}.download"
              label="mod-${index}"
            fi

            if [[ ! -f "$archive" ]]; then
              continue
            fi

            destination="$MODS_DIR/$label"
            mkdir -p "$destination"
            echo "Extracting $label..."
            unar -f -o "$destination" "$archive"
          done

          cat > "$WORK/apply_mods.py" <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          mods_root = Path(sys.argv[1])
          romfs = Path(sys.argv[2])

          def find_romfs(root):
              candidates = sorted(
                  path for path in root.rglob("*")
                  if path.is_dir() and path.name.lower() == "romfs"
              )
              if len(candidates) > 1:
                  raise SystemExit(
                      f"{root.name}: multiple romfs directories found; "
                      "put exactly one RomFS mod in each Mod_URL archive."
                  )
              if candidates:
                  return candidates[0]

              files = [path for path in root.rglob("*") if path.is_file()]
              if files:
                  return root
              raise SystemExit(f"{root.name}: mod archive contains no files.")

          def safe_relative(path, root):
              try:
                  relative = path.resolve().relative_to(root.resolve())
              except ValueError as error:
                  raise SystemExit(f"Mod path escapes its archive: {path}") from error
              if any(part in ("", ".", "..") for part in relative.parts):
                  raise SystemExit(f"Invalid mod path: {relative}")
              return relative

          mod_dirs = sorted(path for path in mods_root.iterdir() if path.is_dir())
          if not mod_dirs:
              print("No mods configured.")
              raise SystemExit(0)

          romfs.mkdir(parents=True, exist_ok=True)
          for mod_dir in mod_dirs:
              source = find_romfs(mod_dir)
              copied = 0
              for item in source.rglob("*"):
                  if not item.is_file():
                      continue
                  relative = safe_relative(item, source)
                  destination = romfs / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, destination)
                  copied += 1
              print(f"Applied {mod_dir.name}: {copied} file(s)")
          PY

          python - "$WORK" <<'PY'
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          mods_dir = work / "mods"
          if not any(path.is_dir() for path in mods_dir.iterdir()):
              print("No mods configured; leaving the nxnative builder unchanged.")
              raise SystemExit(0)

          script = next(
              Path.cwd().glob("scripts/build_ipa_from_nsp.py"),
              None,
          )
          if script is None:
              raise SystemExit("Could not find build_ipa_from_nsp.py")

          text = script.read_text()
          old = "run([nx, keys, base, upd or '-', tmp, '--romfs-image']"
          new = "run([nx, keys, base, upd or '-', tmp]"
          if old in text:
              text = text.replace(old, new, 1)
          elif "run([nx, keys, base, upd or '-', tmp]" not in text:
              raise SystemExit(
                  "The pinned nxnative builder changed; mod integration was not applied."
              )
          marker = "    swap_in(tmp, dst)\n"
          overlay = (
              marker
              + "    mods = os.environ.get('NXNATIVE_MODS_DIR')\n"
              + "    if mods:\n"
              + "        run([sys.executable, os.environ['NXNATIVE_MODS_SCRIPT'], mods, dst / 'RomFS'], log)\n"
          )
          if marker not in text:
              raise SystemExit(
                  "The pinned nxnative builder changed; mod overlay hook was not applied."
              )
          script.write_text(text.replace(marker, overlay, 1))
          print(f"Enabled writable RomFS mod overlay in {script}")
          PY

          echo "NXNATIVE_MODS_DIR=$MODS_DIR" >> "$GITHUB_ENV"
          echo "NXNATIVE_MODS_SCRIPT=$WORK/apply_mods.py" >> "$GITHUB_ENV"
 
      - name: Detect game title ID and select shader profile
        if: ${{ !startsWith(inputs.device, 'Switch 2') }}
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          if [[ -n "${PROFILE_OVERRIDE:-}" ]]; then
            DETECTED_ID="$PROFILE_OVERRIDE"
            echo "Using configured profile ID override: $DETECTED_ID"
          else
            DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path
 
          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def container_names(path, offset, magic, entry_size, name_offset):
              try:
                  with path.open("rb") as f:
                      f.seek(offset)
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != magic:
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )
 
                      if count > 100000 or string_size > 100000000:
                          return []
 
                      entries = f.read(count * entry_size)
                      strings = f.read(string_size)
 
                      if len(entries) != count * entry_size:
                          return []
 
                      names = []
 
                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * entry_size + name_offset
                          )[0]
 
                          if offset >= len(strings):
                              continue
 
                          end = strings.find(b"\0", offset)
 
                          if end < 0:
                              continue
 
                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )
 
                      return names
 
              except (OSError, struct.error):
                  return []

          def pfs0_names(path):
              return container_names(path, 0, b"PFS0", 0x18, 0x10)

          def xci_names(path):
              names = []
              pending = [(0xF000, b"HFS0")]
              visited = set()

              try:
                  with path.open("rb") as f:
                      while pending:
                          container_offset, magic = pending.pop()

                          if container_offset in visited:
                              continue
                          visited.add(container_offset)

                          f.seek(container_offset)
                          header = f.read(16)

                          if len(header) != 16 or header[:4] != magic:
                              continue

                          count, string_size = struct.unpack_from(
                              "<II", header, 4
                          )

                          if count > 100000 or string_size > 100000000:
                              continue

                          entry_size = 0x40 if magic == b"HFS0" else 0x18
                          name_offset = 0x10
                          entries = f.read(count * entry_size)
                          strings = f.read(string_size)
                          data_offset = (
                              container_offset
                              + 0x10
                              + count * entry_size
                              + string_size
                          )

                          if len(entries) != count * entry_size:
                              continue

                          for i in range(count):
                              entry = i * entry_size
                              file_offset, file_size = struct.unpack_from(
                                  "<QQ", entries, entry
                              )
                              name_start = struct.unpack_from(
                                  "<I", entries, entry + name_offset
                              )[0]

                              if name_start >= len(strings):
                                  continue

                              name_end = strings.find(b"\0", name_start)
                              if name_end < 0:
                                  continue

                              name = strings[name_start:name_end].decode(
                                  errors="replace"
                              )
                              names.append(name)

                              child_offset = data_offset + file_offset
                              f.seek(child_offset)
                              child_magic = f.read(4)
                              if child_magic in (b"HFS0", b"PFS0"):
                                  pending.append((child_offset, child_magic))

              except (OSError, struct.error):
                  return names

              return names

          candidates = set()
          title_id_pattern = re.compile(
              r"(?<![0-9A-Fa-f])([0-9A-Fa-f]{16})(?:[._-]|$)"
          )

          def add_candidate(value):
              title_id = int(value, 16)

              if (title_id & 0xFFF) == 0:
                  candidates.add(f"{title_id:016X}")

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              names = pfs0_names(path)
              if path.suffix.lower() in {".xci", ".xcz"}:
                  names.extend(xci_names(path))

              for name in names:
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      add_candidate(match.group(1))

                  for match in title_id_pattern.finditer(name):
                      add_candidate(match.group(1))

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  add_candidate(match.group(1))

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
            )"
          fi

          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"
 
          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi
 
          echo "Selected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Detect Switch 2 title ID and check disk space
        if: startsWith(inputs.device, 'Switch 2')
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          # The title ID is the program ID inside base/exefs/main.npdm
          # (META header, ACI0 offset at 0x70, program ID at ACI0 + 0x10).
          DETECTED_ID="$(python - "$GAME_DIR/base/exefs/main.npdm" <<'PY'
          import struct
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          if data[:4] != b"META":
              raise SystemExit("main.npdm has no META header.")
          aci0 = struct.unpack_from("<I", data, 0x70)[0]
          if data[aci0:aci0 + 4] != b"ACI0":
              raise SystemExit("main.npdm has no ACI0 section.")
          print(f"{struct.unpack_from('<Q', data, aci0 + 0x10)[0]:016X}")
          PY
          )"

          KNOWN_ID="040074A01BF12000"
          if [[ -n "${PROFILE_OVERRIDE:-}" ]]; then
            PROFILE_ID="$(echo "$PROFILE_OVERRIDE" | tr '[:lower:]' '[:upper:]')"
            echo "Using configured profile ID override: $PROFILE_ID"
          else
            PROFILE_ID="$DETECTED_ID"
          fi

          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi

          if [[ "$PROFILE_ID" != "$KNOWN_ID" ]]; then
            echo "::error::Title ID $PROFILE_ID has no profile at the pinned nxnative commit. Upstream packs a Switch 2 folder only for a game with a profile; the only one is Donkey Kong Bananza ($KNOWN_ID)."
            exit 1
          fi

          echo "Selected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

          # Upstream estimates the need as the RomFS trees plus 6 GB.
          GAME_KB="$(du -sk "$GAME_DIR" | cut -f1)"
          NEED_KB=$(( GAME_KB + 6 * 1024 * 1024 ))
          FREE_KB="$(df -k "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "Game folder: $(( GAME_KB / 1024 / 1024 )) GB; free: $(( FREE_KB / 1024 / 1024 )) GB; needed: about $(( NEED_KB / 1024 / 1024 )) GB"
          if (( FREE_KB < NEED_KB )); then
            echo "::error::Not enough free disk space on this runner for the build. Use a runner with more disk (for example the xlarge option) or a smaller package."
            exit 1
          fi
 
      - name: Update shader toolchain lock and header
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"
 
          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"
 
          if [[ -z "$CHAIN_SCRIPT" ]]; then
            if [[ "$IS_S2" == "true" ]]; then
              # Not checked against the Switch 2 commit: it may handle this
              # inside the packer, so do not stop the build here.
              echo "::warning::dmsh_chain.py not found in this nxnative version; skipping the toolchain header step."
              exit 0
            fi
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi
 
          python "$CHAIN_SCRIPT" --header
 
      - name: Prepare 8 GB device settings (Switch 2)
        if: ${{ startsWith(inputs.device, 'Switch 2') && startsWith(inputs.switch2_output, 'IPA') }}
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/NxNative-DonkeyKongBananza-env.txt"
          : > "$ENV_FILE"

          case "$MEMORY_PROFILE" in
            None*)
              echo "Memory profile: none; the app keeps upstream defaults."
              ;;
            *)
              # Documented by upstream (docs/playing.md, nxnative.org/settings):
              #   DM_OPMODE=0            handheld mode: lower resolution
              #   DM_FPS_TARGET=30       30 fps target: less GPU load and heat
              #   DM_PRESENT_UPSCALE=off no MetalFX pass: no extra GPU time
              {
                echo "DM_OPMODE=0"
                echo "DM_FPS_TARGET=30"
                echo "DM_PRESENT_UPSCALE=off"
              } >> "$ENV_FILE"
              if [[ "$MEMORY_PROFILE" == Aggressive* ]]; then
                # Upstream says to turn Metal 4 pipelines off if a game runs
                # out of memory. The key name comes from a user's env.txt in
                # nxnative issue 932, not from upstream's docs. Cost: no
                # pipeline prebuild, so short stalls in new scenes.
                echo "DM_PSO_MTL4=0" >> "$ENV_FILE"
              fi
              ;;
          esac

          echo "S2_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          echo "=== env.txt for the device ==="
          cat "$ENV_FILE"

      - name: Build Switch 2 package
        if: startsWith(inputs.device, 'Switch 2')
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          # Only pass flags this nxnative version actually accepts.
          HELP="$(python scripts/build_ipa_from_nsp.py --help 2>&1 || true)"
          supports() { grep -q -- "$1" <<<"$HELP"; }

          args=("$GAME_DIR")
          if [[ "$S2_OUTPUT" == Mac* ]]; then
            args+=(--platform mac-app)
          else
            # The community report that got this game running on an 8 GB iPad
            # used --platform ios explicitly.
            args+=(--platform ios)
            if supports "--output"; then
              args+=(-o "$OUTPUT")
            fi
            # Bake the 8 GB settings into the app (same format as Documents/env.txt).
            if [[ -n "${S2_ENV_FILE:-}" && -s "${S2_ENV_FILE:-}" ]]; then
              if supports "--env-file"; then
                args+=(--env-file "$S2_ENV_FILE")
                echo "Baking $(wc -l < "$S2_ENV_FILE" | tr -d ' ') setting(s) into the app with --env-file."
              else
                echo "::warning::This nxnative version has no --env-file option. Copy the env.txt artifact into the app's Documents folder instead."
              fi
            fi
          fi
          if supports "--allow-other-metal"; then
            args+=(--allow-other-metal)
          fi

          # No -k: a Switch 2 folder is not encrypted and upstream ignores it.
          echo "Running: python scripts/build_ipa_from_nsp.py ${args[*]}"
          python scripts/build_ipa_from_nsp.py "${args[@]}"

          if [[ "$S2_OUTPUT" == Mac* ]]; then
            APP="$(find "$GAME_DIR" -maxdepth 2 -name '*.app' -type d 2>/dev/null | head -n 1 || true)"
            if [[ -z "$APP" ]]; then
              APP="$(find "$RUNNER_TEMP" -maxdepth 3 -name '*.app' -type d -not -path '*/nxnative/*' 2>/dev/null | head -n 1 || true)"
            fi
            if [[ -z "$APP" ]]; then
              echo "::error::The build finished but no .app was found."
              exit 1
            fi
            ZIP="$RUNNER_TEMP/NxNative-DonkeyKongBananza-mac.zip"
            echo "Packing $APP"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
            echo "S2_ARTIFACT_PATH=$ZIP" >> "$GITHUB_ENV"
            ls -lh "$ZIP"
          else
            if [[ ! -s "$OUTPUT" ]]; then
              FOUND="$(find "$GAME_DIR" -maxdepth 2 -name '*.ipa' -type f 2>/dev/null | head -n 1 || true)"
              if [[ -n "$FOUND" ]]; then
                mv "$FOUND" "$OUTPUT"
              fi
            fi
            if [[ ! -s "$OUTPUT" ]]; then
              echo "::error::IPA build did not produce an output file."
              exit 1
            fi
            echo "S2_ARTIFACT_PATH=$OUTPUT" >> "$GITHUB_ENV"
            echo "IPA successfully created: $OUTPUT"
            ls -lh "$OUTPUT"
          fi

      - name: Build unsigned IPA
        if: ${{ !startsWith(inputs.device, 'Switch 2') }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"
 
          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            --allow-other-metal \
            -o "$OUTPUT"
 
          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi
 
          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"
 
      - name: Install checklist for 8 GB devices (Switch 2)
        if: ${{ success() && startsWith(inputs.device, 'Switch 2') && startsWith(inputs.switch2_output, 'IPA') }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Donkey Kong Bananza on an 8 GB iPhone or iPad"
            echo
            echo "Settings baked in: **${MEMORY_PROFILE}**."
            echo
            echo "1. When you sideload, turn **Increased Memory Limit** on (Sideloadly, LiveContainer or your tool's equivalent). This is the one that matters most and it cannot be set from this workflow."
            echo "2. The pool the game asks for is 9 GiB of address space, not 9 GiB of RAM. The community run on an 8 GB iPad Pro M4 used about 3.6 to 4.8 GB resident."
            echo "3. The first start builds pipelines for about 4 minutes, once. Do not judge speed before that is done."
            echo "4. If iOS still closes the app, build again with the **Aggressive** profile."
            echo "5. If the IPA is too big to install, upstream has \`--romfs separate\` (game data copied to the app's Documents/romfs). This workflow does not use it because the data would stay on the runner."
            echo "6. To change a setting later without rebuilding, put the \`env.txt\` artifact in the app's Documents folder (one KEY=VALUE per line)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload device settings (Switch 2)
        if: ${{ success() && startsWith(inputs.device, 'Switch 2') && startsWith(inputs.switch2_output, 'IPA') }}
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Switch2-env-txt
          path: ${{ runner.temp }}/NxNative-DonkeyKongBananza-env.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Switch 2 build
        if: ${{ success() && startsWith(inputs.device, 'Switch 2') }}
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Switch2-DonkeyKongBananza-${{ startsWith(inputs.switch2_output, 'Mac') && 'MacApp' || 'IPA' }}
          path: ${{ env.S2_ARTIFACT_PATH }}
          if-no-files-found: error
          # The IPA and the zip are already compressed.
          compression-level: 0
          retention-days: 7

      - name: Upload IPA
        if: ${{ success() && !startsWith(inputs.device, 'Switch 2') }}
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7
 
      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7
 
      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles" \
            "$RUNNER_TEMP/NxNative-DonkeyKongBananza-mac.zip" \
            "$RUNNER_TEMP/NxNative-DonkeyKongBananza-env.txt"
            